{% extends 'books/base.html' %}

{% block content %}
    {% if is_pending %}
        <div class="alert alert-warning">
            Your request to be an author is currently <strong>pending</strong>.
        </div>
    {% endif %}

    <div class="row">
        {% for book in books %}
            <div class="col-md-4">
                <div class="card mb-4 shadow-sm">
                    {% if book.cover_image %}
                        <img src="{{ book.cover_image.url }}" class="card-img-top" alt="{{ book.title }}">
                    {% endif %}

                    <div class="card-body">
                        <h5 class="card-title">{{ book.title }}</h5>
                        <p class="card-text"><strong>Price:</strong> KES {{ book.price }}</p>
                        <a href="{% url 'book_detail' book.pk %}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
