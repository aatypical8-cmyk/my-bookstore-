<div class="preview-container">
    <h2>Preview: {{ book.title }}</h2>

    <div class="pdf-viewer" style="height: 600px; width: 100%;">
        <iframe src="{{ preview_url }}" width="100%" height="100%"></iframe>
    </div>

    <div class="actions" style="margin-top: 20px;">
        <p><em>Note: This is a preview. Purchase the book to download or read the full version.</em></p>
        <a href="{% url 'book_detail' book.pk %}" class="btn">Back to Details</a>
        <a href="{% url 'buy_book' book.pk %}" class="btn-buy">Buy Now</a>
    </div>
</div>
