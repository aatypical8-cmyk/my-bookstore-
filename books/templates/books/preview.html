<div class="preview-container" style="padding: 20px;">
    <h2>Preview: {{ book.title }}</h2>

    <!-- The Google Docs Viewer wrapper forces the document to display in-browser -->
    <div class="pdf-viewer" style="height: 600px; width: 100%; border: 1px solid #ccc;">
        <iframe
            src="https://docs.google.com/viewer?url={{ preview_url }}&embedded=true"
            width="100%"
            height="100%"
            frameborder="0">
        </iframe>
    </div>

    <div class="actions" style="margin-top: 20px;">
        <p><em>Note: This is a preview. Purchase the book to download or read the full version.</em></p>
        <a href="{% url 'book_detail' book.pk %}" class="btn">Back to Details</a>

        <!-- Ensure 'request_payment' is the correct name from your urls.py -->
        <a href="{% url 'request_payment' book.pk %}" class="btn-buy" style="margin-left: 10px;">Buy Now</a>
    </div>
</div>
