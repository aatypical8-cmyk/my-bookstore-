{% extends 'base.html' %}

{% block content %}
<div class="reader-container" style="text-align: center; margin: 20px auto; max-width: 1200px; padding: 0 15px;">
    <h2 style="margin-bottom: 20px; font-family: sans-serif; color: #333;">Reading: {{ book.title }}</h2>

    <div style="box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; background: #fff;">
        <!-- Embedded native viewer reading data locally without cross-origin dependencies -->
        <iframe
            src="data:application/pdf;base64,{{ pdf_data }}#toolbar=0&navpanes=0"
            width="100%"
            height="850px"
            style="border: none; display: block;"
            oncontextmenu="return false;">
        </iframe>
    </div>
</div>

<script>
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S' || e.key === 'P')) {
            e.preventDefault();
            alert("Downloading and printing is restricted for this ebook asset.");
        }
    });
</script>
{% endblock %}
