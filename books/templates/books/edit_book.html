{% extends 'books/base.html' %}

{% block content %}
<h2>Edit Book</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'book_list' %}">Cancel</a>
</form>

{% endblock %}
